      if (mine(OB()).length) { if (!retryT) { const d = [2, 5, 10, 20, 40, 60][Math.min(retryN++, 5)] * 1000; retryT = setTimeout(() => { retryT = null; flush(); }, d); } }
      else { retryN = 0; if (ST.stage === 'done') forgetInvite(); }
      waiters.slice().forEach(w => w());
    }
  }
  window.addEventListener('online', () => { retryN = 0; flush(); });
  function verified(sid, seq) { const r = RC()[sid]; return !!(r && r.seq >= seq); }
  function waitVerified(sid, seq, ms) {
    return new Promise(res => {
      if (verified(sid, seq)) { res(true); return; }
      let to = null;
      const w = () => { if (verified(sid, seq)) settle(true); };
      const settle = v => { clearTimeout(to); const i = waiters.indexOf(w); if (i >= 0) waiters.splice(i, 1); res(v); };
      waiters.push(w);
      to = setTimeout(() => settle(verified(sid, seq)), ms);
      flush();
    });
  }
  async function savedOrRetry(why) {
    if (!persisting() || !ST.sid) return true;
    const ob = OB()[ST.sid];
    const seq = ob ? ob.seq : ST.seq;
    const start = why === 'agreement';
    let tries = 0;
    for (;;) {
      sheet('saving', start ? '<h1>Starting</h1><p id="saving-status">Connecting to the study…</p>' : '<h1>Saving</h1><p id="saving-status">Saving your answers…</p>', []);
      if (await waitVerified(ST.sid, seq, T.VERIFY_WAIT_MS)) { log('saved_verified', { why: why, seq: seq }); return true; }
      tries += 1;
      log('save_unverified', { why: why, tries: tries });
      save(true);
      await new Promise(res => {
        const w = () => { if (verified(ST.sid, seq)) { const i = waiters.indexOf(w); if (i >= 0) waiters.splice(i, 1); res(); } };
        waiters.push(w);
        const nocode = tries >= 2 ? '<p class="fine" id="nocode">If this keeps failing, you can stop here: return to ' + CFG.platform +
          ', use its option for finishing without a completion code, and message the researcher with your study code <b>' + S.code +
          '</b>. Genuine participation will be paid.</p>' : '';
        sheet('saving', (start ? '<h1 id="agree-unverified">Could not start yet</h1><p id="saving-status">The study could not confirm that this browser is connected to your study session. If you have already started this study in another browser or on another device, please continue there. Otherwise, please check your connection and try again.</p>'
          : '<h1>Not saved yet</h1><p id="saving-status">Your answers have not been confirmed as saved yet. Please check your connection and try again.</p>') + nocode,
          [{ text: 'Try again', id: 'btn-retry', on: () => { const i = waiters.indexOf(w); if (i >= 0) waiters.splice(i, 1); retryN = 0; res(); } }]);
      });
    }
  }
  function sheet(id, html, buttons) {
    const scr = $(id); scr.innerHTML = '';
    const w = document.createElement('div'); w.className = 'sheet'; w.style.display = 'flex'; w.style.flexDirection = 'column';
    w.innerHTML = html;
    const c = document.createElement('div'); c.className = 'choices';
    buttons.forEach(b => {
      const el = document.createElement('button'); el.className = 'btn' + (b.quiet ? ' quiet' : ''); el.textContent = b.text;
      if (b.id) el.id = b.id;
      el.addEventListener('click', b.on); c.appendChild(el);
    });
    w.appendChild(c); scr.appendChild(w); show(id);
  }
  function intro() {
    return new Promise(resolve => {
      sheet('intro', '<h1>Candidate ' + S.label + '</h1><p>Five short challenges. Play them in whatever way makes sense to you.</p>',
        [{ text: 'Start', id: 'btn-start', on: () => { log('intro_start'); resolve(); } }]);
    });
  }
  function resumeScreen() {
    return new Promise(resolve => {
      resumeWait = true; accrue();
      sheet('resume', '<h1>Candidate ' + S.label + '</h1><p>Continue where you left off.</p>',
        [{ text: 'Continue', id: 'btn-resume', on: () => { resumeWait = false; accrue(); resolve(); } }]);
    });
  }
  function consent() {
    return new Promise(resolve => {
      sheet('consent', CFG.consentHtml, [
        { text: 'Start', id: 'btn-consent', on: () => { if ($('agree').checked) { consented = true; record.consent = { at: 0, version: CFG.consentVersion }; resolve(true); } } },
        { text: 'I do not agree', quiet: true, on: () => { forgetInvite(); resolve(false); } }]);
      const btn = $('btn-consent'); btn.disabled = true;
      $('agree').addEventListener('change', () => { btn.disabled = !$('agree').checked; });
    });
  }
  function goOther(extraParams) {
    const u = S.other + '?code=' + encodeURIComponent(S.code) + '&next=' + encodeURIComponent('q031-' + CFG.page + '.html') +
      extraParams + (S.dev ? '&dev=1' : '') + (S.study ? '&study=1' : '') + (consented ? '&agreed=1' : '');
    window.__q031.navigatedTo = u;
    leaving = true;
    if (haveLock && !lockLost()) LS.del(LKK);
    haveLock = false;
    location.href = u;
  }
  function completionHtml(rc) {
    if (rc && rc.code && COMPLETION) {
      const link = COMPLETION + (COMPLETION.indexOf('?') < 0 ? '?' : '&') + 'cc=' + encodeURIComponent(rc.code);
      return '<p>Your answers arrived (receipt ' + rc.receipt + '). Return to ' + CFG.platform + ' with completion code <b id="completion-code">' + rc.code +
        '</b>.</p><div class="choices"><a class="btn" id="completion-link" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="' + link + '">Finish on ' + CFG.platform + '</a></div>';
    }
    return '<p id="completion-nocode">Your answers arrived' + (rc && rc.receipt ? ' (receipt ' + rc.receipt + ')' : '') + ', but the completion code could not be shown. Please return to ' + CFG.platform +
      ', use its option for finishing without a completion code, and message the researcher with your study code. Genuine participation will be paid.</p>';
  }
  function inviteStop(why) {
    blocked = true; consented = false;
    const tail = ' If this keeps happening, message the researcher through ' + CFG.platform + ' with your study code <b>' + S.code + '</b>.';
    if (why === 'storage') {
      sheet('finish', '<h1>This browser cannot run the study</h1><p id="invite-storage">This page needs to keep a little information in this browser while you take part, and this browser is not allowing it (site data may be blocked for this page). Nothing has been recorded or sent. Please open your study link from ' +
        CFG.platform + ' again in Google Chrome with site data allowed.' + tail + '</p>', []);
      return;
    }
    sheet('finish', '<h1>Please reopen your study link</h1><p id="invite-missing">This page was not opened from your personal study link, so it has stopped and is not recording or sending anything. Please return to ' +
      CFG.platform + ' and open your study link from there again, in this browser; anything already saved will be kept.' + tail + '</p>', []);
  }
  function inviteProblem(resuming) {
    if (!SSX || !cryptoOK) return 'storage';
    if (!INVITE) return 'invite';
    if ((resuming || S.pos === 2 || S.mode === 'extra') && !getSession()) return 'session';
    return null;
  }
  function showDone() {
    let rc = ST.final;
    if (!rc) { const own = RC()[ST.sid]; if (own && own.final) rc = own; }
    sheet('finish', '<h1>Thank you</h1><p>You are done. Your study code is <b>' + S.code + '</b>.</p><div id="completion">' + completionHtml(rc) + '</div>', []);
  }
  let finishing = false;
  async function finish() {
    if (finishing) return;
    finishing = true;
    if (!ST.finalQueued) {
      log('finish');
      record.completed = true;
      ST.finalQueued = true;
      setStage('finish');
      enqueue(true);
    }
    const done = '<h1>Thank you</h1><p>You are done. Your study code is <b>' + S.code + '</b>.</p>';
    if (!persisting()) { sheet('finish', done + '<div id="completion"></div>', []); return; }
    await savedOrRetry('final');
    const rc = RC()[ST.sid] || {};
    ST.final = { receipt: rc.receipt || null, code: rc.code || null };
    sheet('finish', done + '<div id="completion">' + completionHtml(rc) + '</div>', []);
    ST.stage = 'done'; save(true);
    try {
      const pre = 'q031s:' + S.code + ':';
      LS.keys().forEach(k => {
        if (k.indexOf(pre) !== 0) return;
        if (/:rec$/.test(k)) { LS.del(k); return; }
        const o = LS.get(k); if (o && o.st) LS.set(k, { st: doneMarker(o.st) });
      });
    } catch (e) {  }
    if (haveLock && !lockLost()) LS.del(LKK);
    haveLock = false;
    if (!mine(OB()).length) forgetInvite();
  }
  function finalChoice() {
    return new Promise(resolve => {
      sheet('choice', '<h1>One more?</h1><p>You have tried Candidate A and Candidate B. You can play one more challenge from either, or stop here. All three options receive the same payment.</p>',
        [{ text: 'One more Candidate A challenge', id: 'choice-A', quiet: true, on: () => pick('A') },
         { text: 'One more Candidate B challenge', id: 'choice-B', quiet: true, on: () => pick('B') },
         { text: 'Stop here', id: 'choice-stop', quiet: true, on: () => pick('stop') }]);
      function pick(c) { document.querySelectorAll('#choice .btn').forEach(b => { b.disabled = true; }); resolve(c); }
    });
  }
  function between() {
    return new Promise(resolve => {
      sheet('between', '<h1>Candidate ' + S.label + ' is done</h1><p>Next is Candidate ' + S.otherLabel + '.</p>',
        [{ text: 'Continue', id: 'btn-continue', on: ev => { ev.currentTarget.disabled = true; log('to_other'); resolve(); } }]);
    });
  }
  function startExtraHere() {
    S.mode = 'extra'; record.mode = 'extra';
    record.extra = { label: S.label };
    log('extra_start');
    setStage('extra', { sitIndex: 0, hist: [] });
    enqueue(false);
  }
  async function flow(resuming) {
    for (;;) {
      const s = ST.stage;
      if (s === 'intro') { await intro(); setStage('play', { sitIndex: 0, hist: [] }); resuming = false; continue; }
      if (s === 'play') { await runPhase(CFG.situations, T.CAP_MS, 'main', resuming); resuming = false; setStage('questions', { qIndex: 0 }); continue; }
      if (s === 'questions') { await askQuestions(ST.qIndex); setStage(S.pos === 1 ? 'between' : 'choice'); enqueue(false); continue; }
      if (s === 'between') {
        await between();
        enqueue(false);
        await savedOrRetry('to_other');
        goOther('&pos=2&label=' + S.otherLabel);
        return;
      }
      if (s === 'choice') {
        const c = await finalChoice();
        record.finalChoice = c; ST.choice = c;
        log('final_choice', { choice: c });
        if (c === 'stop') { setStage('finish'); continue; }
        if (c === S.label) { startExtraHere(); continue; }
        setStage('toextra'); enqueue(false); continue;
      }
      if (s === 'toextra') {
        await savedOrRetry('to_extra');
        goOther('&pos=1&label=' + S.otherLabel + '&mode=extra&choice=' + ST.choice);
        return;
      }
      if (s === 'extra') {
        await runPhase([CFG.extra], T.EXTRA_CAP_MS, 'extra', resuming); resuming = false;
        record.extra.outcome = record.situations.length ? record.situations[record.situations.length - 1].outcome : null;
        setStage('finish');
        continue;
      }
      if (s === 'finish' || s === 'done') { await finish(); return; }
      return;
    }
  }
  function restore(saved) {
    Object.assign(ST, saved.st);
    const r = LS.get(KEY + ':rec');
    if (r) { for (const k in record) delete record[k]; Object.assign(record, r); }
    if (saved.clk) Object.assign(CLK, saved.clk);
    S.mode = record.mode || S.mode;
    const gap = Math.max(0, Date.now() - (saved.savedAt || Date.now()));
    CLK.resumes += 1; CLK.resumeGapMs += gap;
    return gap;
  }
  async function main() {
    buildPlayScreen();
    setInterval(tick, T.TICK_MS);
    if (S.dev && P.get('consentpreview') === '1') {
      sheet('consent', CFG.consentHtml, [{ text: 'Start', on: () => {} }, { text: 'I do not agree', quiet: true, on: () => {} }]);
      return;
    }
    const saved = S.study ? LS.get(KEY) : null;
    if (saved && saved.st && saved.st.sid) {
      if (saved.st.stage === 'done') { consented = true; restore(saved); showDone(); if (mine(OB()).length) flush(); else forgetInvite(); return; }
      const stop = inviteProblem(true);
      if (stop) { inviteStop(stop); return; }
      const tookOver = takeOver();
      consented = true;
      const gap = restore(saved);
      if (tookOver) log('took_over');
      flush();
      if (ST.stage === 'finish') { await flow(false); return; }
      if (ST.stage === 'agree') { await savedOrRetry('agreement'); setStage('intro'); await flow(false); return; }
      log('reloaded', { gapMs: gap });
      await resumeScreen();
      log('resumed');
      save(true);
      await flow(true);
      return;
    }
    if (S.study) {
      const stop = inviteProblem(false);
      if (stop) { inviteStop(stop); return; }
    }
    if (S.pos === 1 && S.study && S.mode === 'main') {
      const ok = await consent();
      if (!ok) { sheet('finish', '<h1>Thank you</h1><p>No study data has been collected. You can close this page.</p>', []); return; }
    }
    if (persisting()) {
      if (S.pos === 1 && S.mode === 'main') startSession();
      const tookOver = takeOver();
      ST.sid = newSid(); record.sid = ST.sid; ST.w0 = Date.now();
      if (tookOver) log('took_over');
      CLK.hides = 0; CLK.shows = 0; CLK.hiddenMs = 0;
      flush();
    }
    if (S.mode === 'extra') {
      const ch = P.get('choice');
      record.finalChoice = ch === 'A' || ch === 'B' ? ch : null;
      record.extra = { label: S.label };
      log('extra_start');
      setStage('extra', { sitIndex: 0, hist: [] });
      enqueue(false);
      await flow(false);
      return;
    }
    if (persisting() && S.pos === 1 && S.mode === 'main') {
      setStage('agree'); enqueue(false);
      await savedOrRetry('agreement');
    }
    setStage('intro');
    await flow(false);
  }
  window.__q031 = {
    jump: S.dev ? function (k, extra) {
      finishAll(); endingPlaying = false; awaitingNext = false; $('btn-next').hidden = true;
      sitList = extra ? [CFG.extra] : CFG.situations; show('play');
      startSituation(extra ? 0 : k);
    } : undefined,
    record: () => JSON.parse(JSON.stringify(record)),
    clock: () => { accrue(); return clockView(); },
    stage: () => ST.stage,
    outbox: () => OB(), receipts: () => RC(),
    timing: T, params: S, busy: busy, finishAll: finishAll,
    view: () => View, inputEnabled: () => inputEnabled, endingPlaying: () => endingPlaying, navigatedTo: null,
    lastTick: () => lastTickAt, defunct: () => defunct,
    session: () => { const g = getSession(); return g ? { gs: g.gs } : null; }, blocked: () => blocked
  };
  View.init({ log: log, tween: tween, ease: ease, T: T, finishAll: finishAll });
  window.addEventListener('DOMContentLoaded', main);
})();

</script>
